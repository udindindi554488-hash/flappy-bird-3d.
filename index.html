
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#48bafa">
<title>Panci Terbang - UST.SAE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#48bafa;font-family:system-ui,Arial,sans-serif;touch-action:none;color:white}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
.hud{position:fixed;top:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.pill{background:#16436de8;border:2px solid #ffffff77;border-radius:16px;padding:9px 13px;font-size:14px;font-weight:900;box-shadow:0 4px 0 #16334b77}
.hud button{pointer-events:auto;color:white}
.overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:18px;background:#09253a66}
.panel{width:min(380px,100%);padding:25px 20px;text-align:center;border-radius:28px;background:linear-gradient(150deg,#267bc1,#153d70);border:2px solid #ffffff88;box-shadow:0 12px 35px #09253a88}
.logo{font-size:66px}
h1{font-size:32px;line-height:1.05;color:#ffe66b;margin:7px 0}
p{line-height:1.5;color:#e5f5ff}
.mainbtn{width:100%;padding:15px;margin-top:10px;border:0;border-radius:16px;background:linear-gradient(#fff078,#ffbc28);color:#29466a;font-size:18px;font-weight:1000;box-shadow:0 5px 0 #b77916}
.secondary{width:100%;padding:12px;margin-top:10px;background:#ffffff18;color:white;border:1px solid #ffffff88;border-radius:14px;font-weight:800}
.hidden{display:none!important}
.small{font-size:12px;color:#cceaff}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
 <div class="pill">⭐ <span id="score">0</span></div>
 <button class="pill" id="pause">Ⅱ</button>
 <div class="pill">🏆 <span id="best">0</span></div>
</div>

<div class="overlay" id="home">
 <div class="panel">
  <div class="logo">🍳</div>
  <h1>PANCI<br>TERBANG</h1>
  <p>Terbangkan panci, hindari bambu, dan raih skor tertinggi!</p>
  <button class="mainbtn" id="start">▶ MULAI BERMAIN</button>
  <button class="secondary" id="sound">🔊 SUARA: ON</button>
  <p class="small">Ketuk layar untuk membuat panci terbang</p>
  <p class="small">UST.SAE EDITION</p>
 </div>
</div>

<div class="overlay hidden" id="over">
 <div class="panel">
  <div class="logo">💥🍳</div>
  <h1>GAME OVER!</h1>
  <p>Skor kamu: <b id="final">0</b><br>Rekor terbaik: <b id="record">0</b></p>
  <button class="mainbtn" id="again">↻ MAIN LAGI</button>
  <button class="secondary" id="homeBtn">MENU UTAMA</button>
 </div>
</div>

<div class="overlay hidden" id="paused">
 <div class="panel">
  <div class="logo">⏸️</div>
  <h1>PAUSED</h1>
  <button class="mainbtn" id="resume">LANJUTKAN</button>
  <button class="secondary" id="exit">MENU UTAMA</button>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

const CONFIG={
 gravity:1.30,
 flapPower:0.58,
 maxFall:0.72,
 pipeSpeed:0.37,
 pipeInterval:2.05,
 gapRatio:0.32,
 minGap:205,
 maxGap:255
};

let state="home";
let bird={x:0,y:0,v:0,angle:0};
let pipes=[],score=0,best=0;
let world=0,spawn=0,last=0;
let soundOn=true,audio=null,particles=[];

try{best=Number(localStorage.getItem("flappyBest"))||0}catch(e){}
$("best").textContent=best;

function initAudio(){
 try{
  audio ||= new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
 }catch(e){}
}

function beep(freq=500,dur=.1,type="sine"){
 if(!soundOn)return;
 initAudio();
 if(!audio)return;
 const o=audio.createOscillator();
 const g=audio.createGain();
 o.type=type;
 o.frequency.value=freq;
 g.gain.setValueAtTime(.06,audio.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
 o.connect(g);
 g.connect(audio.destination);
 o.start();
 o.stop(audio.currentTime+dur);
}

$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent=soundOn?"🔊 SUARA: ON":"🔇 SUARA: OFF";
 if(soundOn)beep(600,.1);
};

function rect(x,y,w,h,c,r=0){
 ctx.fillStyle=c;
 if(r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
 }else ctx.fillRect(x,y,w,h);
}

function ellipse(x,y,rx,ry,c){
 ctx.fillStyle=c;
 ctx.beginPath();
 ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
 ctx.fill();
}

function poly(points,c){
 ctx.fillStyle=c;
 ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
 ctx.closePath();
 ctx.fill();
}

function line(x,y,x2,y2,c,w=2){
 ctx.strokeStyle=c;
 ctx.lineWidth=w;
 ctx.beginPath();
 ctx.moveTo(x,y);
 ctx.lineTo(x2,y2);
 ctx.stroke();
}

function ground(){return H*.89}

function drawCloud(x,y,s){
 ellipse(x,y,28*s,12*s,"#ffffffcc");
 ellipse(x+19*s,y-8*s,23*s,15*s,"#ffffffee");
 ellipse(x+39*s,y,27*s,12*s,"#ffffffcc");
}

function bambooDecoration(x,y,h,scale=1){
 const w=13*scale;
 const grad=ctx.createLinearGradient(x,0,x+w,0);
 grad.addColorStop(0,"#176b36");
 grad.addColorStop(.35,"#71c95b");
 grad.addColorStop(.75,"#3a9b48");
 grad.addColorStop(1,"#155b32");
 rect(x,y,w,h,grad,5);
 for(let yy=y+22*scale;yy<y+h;yy+=35*scale){
  rect(x-2*scale,yy,w+4*scale,4*scale,"#176b36",3);
  line(x+3*scale,yy+5*scale,x+3*scale,Math.min(yy+29*scale,y+h),"#a7e77a",1.5);
 }
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#39b9f5");
 g.addColorStop(.68,"#b8edcf");
 g.addColorStop(1,"#e0f7c8");
 rect(0,0,W,H,g);

 ellipse(W*.8,H*.14,34,34,"#fff19a");

 for(let i=0;i<5;i++){
  let x=((i*W*.35-world*12)%(W+130)+W+130)%(W+130)-50;
  drawCloud(x,H*(.16+(i%3)*.12),.9+(i%2)*.2);
 }

 // Hutan bambu di kejauhan
 for(let i=0;i<11;i++){
  let x=((i*W*.17-world*8)%(W+80)+W+80)%(W+80)-30;
  bambooDecoration(x,H*.34,H*.40,.75);
 }

 poly([
  [0,H*.68],[W*.16,H*.52],[W*.33,H*.68],
  [W*.53,H*.49],[W*.75,H*.69],[W*.91,H*.54],
  [W,H*.66],[W,H*.89],[0,H*.89]
 ],"#78c978");

 rect(0,H*.83,W,H*.06,"#64b95a");
 rect(0,H*.87,W,H*.025,"#438e42");

 // Tulisan latar UST.SAE
 ctx.save();
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font=`1000 ${Math.max(38,Math.min(W*.14,82))}px system-ui`;
 ctx.lineWidth=5;
 ctx.strokeStyle="#164b3a55";
 ctx.strokeText("UST.SAE",W*.5,H*.36);
 ctx.fillStyle="#ffffff40";
 ctx.fillText("UST.SAE",W*.5,H*.36);
 ctx.restore();
}

// Rintangan bambu
function drawBamboo(x,gapY,gap,top){
 const w=Math.max(55,W*.145),bottom=ground();
 const grad=ctx.createLinearGradient(x,0,x+w,0);
 grad.addColorStop(0,"#155b2d");
 grad.addColorStop(.22,"#69c94d");
 grad.addColorStop(.52,"#a0df63");
 grad.addColorStop(.78,"#3b9c3e");
 grad.addColorStop(1,"#124b2a");

 let y,h;
 if(top){h=gapY-gap/2;y=0}
 else{y=gapY+gap/2;h=bottom-y}

 rect(x,y,w,h,grad,7);
 rect(x+w*.17,y+5,w*.08,Math.max(0,h-10),"#d8f79a88",4);

 // Ruas bambu
 for(let yy=y+28;yy<y+h-8;yy+=42){
  rect(x-3,yy,w+6,7,"#236c32",4);
  rect(x+3,yy+1,w*.22,2,"#c5ed83",2);
 }

 if(top){
  rect(x-6,Math.max(0,h-15),w+12,15,"#287c36",5);
  rect(x+4,Math.max(0,h-13),w-8,3,"#b5e875",2);
 }else{
  rect(x-6,y,w+12,15,"#287c36",5);
  rect(x+4,y+2,w-8,3,"#b5e875",2);
 }
}

// Karakter panci terbang
function drawPot(){
 const x=bird.x,y=bird.y;
 const r=Math.max(18,Math.min(W*.052,25));

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(bird.angle);

 ellipse(0,r+13,r*1.1,r*.22,"#0003");

 // Api kecil di bawah panci
 poly([
  [-r*.38,r*.55],[-r*.18,r*1.12],[0,r*.66],
  [r*.18,r*1.13],[r*.38,r*.55]
 ],"#ff7b22");
 poly([[-r*.17,r*.66],[0,r*1.02],[r*.17,r*.66]],"#ffe76b");

 // Pegangan samping
 ctx.strokeStyle="#4b5962";
 ctx.lineWidth=r*.18;
 ctx.beginPath();
 ctx.roundRect(r*.67,-r*.18,r*.65,r*.52,r*.2);
 ctx.stroke();

 // Badan panci metalik
 const metal=ctx.createLinearGradient(-r,-r*.4,r,r*.55);
 metal.addColorStop(0,"#667985");
 metal.addColorStop(.22,"#f4fbff");
 metal.addColorStop(.48,"#8ea4ad");
 metal.addColorStop(.72,"#e9f4f5");
 metal.addColorStop(1,"#536875");

 ctx.beginPath();
 ctx.moveTo(-r*.72,-r*.35);
 ctx.lineTo(r*.72,-r*.35);
 ctx.lineTo(r*.58,r*.58);
 ctx.quadraticCurveTo(0,r*.86,-r*.58,r*.58);
 ctx.closePath();
 ctx.fillStyle=metal;
 ctx.fill();
 ctx.strokeStyle="#344d59";
 ctx.lineWidth=2;
 ctx.stroke();

 // Tutup panci
 ellipse(0,-r*.37,r*.78,r*.19,"#d9e6e9");
 ellipse(0,-r*.39,r*.68,r*.12,"#f8ffff");

 // Knop tutup
 rect(-r*.12,-r*.68,r*.24,r*.16,"#465b64",4);
 ellipse(0,-r*.7,r*.16,r*.09,"#263f49");

 line(-r*.43,-r*.15,-r*.35,r*.35,"#ffffff",3);

 // Mata lucu
 ellipse(-r*.2,r*.08,r*.07,r*.09,"#17313b");
 ellipse(r*.2,r*.08,r*.07,r*.09,"#17313b");
 ellipse(-r*.22,r*.05,r*.025,r*.03,"#fff");
 ellipse(r*.18,r*.05,r*.025,r*.03,"#fff");

 ctx.restore();
}

function drawParticles(){
 particles.forEach(p=>ellipse(p.x,p.y,p.r,p.r,p.color));
}

function reset(){
 score=0;
 pipes=[];
 particles=[];
 world=0;
 spawn=1.3;
 bird.x=W*.28;
 bird.y=H*.43;
 bird.v=0;
 bird.angle=0;
 $("score").textContent=score;
}

function startGame(){
 initAudio();
 reset();
 state="playing";
 $("home").classList.add("hidden");
 $("over").classList.add("hidden");
 $("paused").classList.add("hidden");
 $("hud").classList.remove("hidden");
 beep(650,.1);
 last=performance.now();
}

function flap(){
 if(state!=="playing")return;
 bird.v=-H*CONFIG.flapPower;
 beep(520,.08);

 for(let i=0;i<4;i++){
  particles.push({
   x:bird.x-15,y:bird.y+12,
   r:2+Math.random()*3,
   vx:-35-Math.random()*40,
   vy:(Math.random()-.5)*65,
   life:.3,color:"#ffb64c"
  });
 }
}

function endGame(){
 if(state!=="playing")return;
 state="over";
 best=Math.max(best,score);
 try{localStorage.setItem("flappyBest",best)}catch(e){}
 $("best").textContent=best;
 $("final").textContent=score;
 $("record").textContent=best;
 $("hud").classList.add("hidden");
 $("over").classList.remove("hidden");
 beep(130,.35,"sawtooth");
}

function pauseGame(){
 if(state!=="playing")return;
 state="paused";
 $("paused").classList.remove("hidden");
}

function resumeGame(){
 if(state!=="paused")return;
 state="playing";
 $("paused").classList.add("hidden");
 last=performance.now();
}

function home(){
 state="home";
 $("hud").classList.add("hidden");
 $("over").classList.add("hidden");
 $("paused").classList.add("hidden");
 $("home").classList.remove("hidden");
}

$("start").onclick=startGame;
$("again").onclick=startGame;
$("homeBtn").onclick=home;
$("pause").onclick=pauseGame;
$("resume").onclick=resumeGame;
$("exit").onclick=home;

canvas.addEventListener("pointerdown",()=>{
 if(state==="playing")flap();
});

addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp"){
  e.preventDefault();
  if(state==="playing")flap();
  else if(state==="home")startGame();
 }
 if(e.code==="Escape")pauseGame();
});

function spawnPipe(){
 const gap=Math.max(CONFIG.minGap,Math.min(CONFIG.maxGap,H*CONFIG.gapRatio));
 const margin=gap/2+35;
 const gapY=margin+Math.random()*Math.max(0,ground()-margin*2);
 pipes.push({
  x:W+20,
  gapY:Math.min(ground()-margin,Math.max(margin,gapY)),
  gap,passed:false
 });
}

function hitPipe(p){
 const r=Math.max(13,Math.min(W*.035,18));
 const birdL=bird.x-r*.78;
 const birdR=bird.x+r*.8;
 const birdT=bird.y-r*.75;
 const birdB=bird.y+r*.75;
 const pipeW=Math.max(55,W*.145);
 const gapTop=p.gapY-p.gap/2;
 const gapBottom=p.gapY+p.gap/2;

 if(!(birdR>p.x&&birdL<p.x+pipeW))return false;
 return birdT<gapTop||birdB>gapBottom;
}

function update(dt){
 if(state!=="playing")return;
 world+=dt;

 bird.v+=H*CONFIG.gravity*dt;
 bird.v=Math.min(bird.v,H*CONFIG.maxFall);
 bird.y+=bird.v*dt;
 bird.angle=Math.min(.65,Math.max(-.45,bird.v/H*.8));

 spawn-=dt;
 if(spawn<=0){
  spawnPipe();
  spawn=CONFIG.pipeInterval;
 }

 const speed=W*CONFIG.pipeSpeed;

 for(let i=pipes.length-1;i>=0;i--){
  let p=pipes[i];
  p.x-=speed*dt;

  if(!p.passed&&p.x+Math.max(55,W*.145)<bird.x){
   p.passed=true;
   score++;
   $("score").textContent=score;
   beep(900,.09);
  }

  if(hitPipe(p)){endGame();return}
  if(p.x+Math.max(55,W*.145)<0)pipes.splice(i,1);
 }

 const r=Math.max(13,Math.min(W*.035,18));
 if(bird.y-r<0||bird.y+r>ground()){
  endGame();
  return;
 }

 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
}

function draw(){
 background();

 pipes.forEach(p=>{
  drawBamboo(p.x,p.gapY,p.gap,true);
  drawBamboo(p.x,p.gapY,p.gap,false);
 });

 drawParticles();
 drawPot();

 rect(0,ground(),W,H-ground(),"#b7eeff");
 rect(0,ground(),W,8,"#d4ef9d");

 if(state==="home"){
  ctx.textAlign="center";
  ctx.fillStyle="#fff";
  ctx.font="bold 16px system-ui";
  ctx.fillText("KETUK UNTUK TERBANG",W/2,H*.75);
 }
}

function loop(now){
 const dt=Math.min((now-last)/1000||0,.035);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

reset();
last=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
